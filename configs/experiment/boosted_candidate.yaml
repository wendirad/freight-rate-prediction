# @package _global_
# One combined candidate using target-free domain features from the strongest
# public approaches. Intended for a single controlled comparison, not ablation.

features:
  selected:
    - calendar
    - equipment
    - freight_domain

training:
  feature_cols:
    - distance
    - pickup_lat
    - pickup_lon
    - delivery_lat
    - delivery_lon
    - weight
    - market_index
    - quote_signal
