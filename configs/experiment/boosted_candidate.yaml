    - month_cos
    - day_of_week
    - equipment_Dry Van
    - equipment_Flatbed
    - equipment_Reefer
    - log_distance
    - weight_per_km
    - pickup_delivery_lat_delta
    - pickup_delivery_lon_delta
    - geo_distance_km
    - route_distance_ratio
    - market_distance
    - quote_distance
    - days_since_training_start
