# @package _global_
# Combined-removal ablation from features_combined_v1 (126.08 mean MAE
# baseline): drops both market_index_ema and quote_signal_zscore, the two
# families whose individual removal each improved mean MAE (122.42 and
# 122.79 respectively). Everything else matches features_combined_v1
# exactly.

features:
  selected:
    - calendar
    - equipment

training:
  feature_cols:
    - distance
    - pickup_lat
    - pickup_lon
    - delivery_lat
    - delivery_lon
    - weight
    - market_index
    - quote_signal
    - month_sin
    - month_cos
    - day_of_week
    - equipment_Dry Van
    - equipment_Flatbed
    - equipment_Reefer
