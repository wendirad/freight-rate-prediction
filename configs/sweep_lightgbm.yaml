# No `program`/`command` key is defined here, so trials must be launched via
# the Python API (wandb.agent(sweep_id, function=run_sweep_trial), see
# src/experiments/sweep_agent.py), not the CLI `wandb agent` command.
method: bayes

metric:
  name: mae_mean
  goal: minimize

parameters:
  n_estimators:
    distribution: int_uniform
    min: 100
    max: 1000
  learning_rate:
    distribution: uniform
    min: 0.01
    max: 0.3
  num_leaves:
    distribution: int_uniform
    min: 15
    max: 255
  max_depth:
    distribution: int_uniform
    min: -1
    max: 15
  subsample:
    distribution: uniform
    min: 0.5
    max: 1.0
  colsample_bytree:
    distribution: uniform
    min: 0.5
    max: 1.0
  random_state:
    distribution: int_uniform
    min: 0
    max: 10000
