# Default workflow: evaluates the frozen candidate once on October, then
# refits it on all labeled data (including October) and saves a deployable
# prediction bundle. W&B logging is enabled only with `tracker=wandb`.
#
# The 20-fold comparison selected the model's native 500-iteration,
# depth-6, learning-rate-0.05 configuration (95.12 mean CV MAE).
name: final_fit
iterations: 500
eval_metric: MAE
